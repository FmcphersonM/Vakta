# Render Blueprint — Vakta in Frankfurt (EU).
# Currently: free web service + free database (good for a demo; the free
# service sleeps when idle and the free database expires after 30 days).
# Before real customers: change both `plan:` values (e.g. starter / basic-256mb).
# API keys (Anthropic, Twilio, Stripe, Google, Microsoft, SMTP) are added in the
# Render dashboard → vakta → Environment, so they never live in Git.
services:
  - type: web
    name: vakta
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile --prod=false && npx --yes pnpm@10.28.0 run build
    # Creates/updates tables and (first time only) the demo company, then starts.
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: vakta-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY # never change after launch: it unlocks stored calendar tokens and 2FA secrets
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: TELEPHONY_PROVIDER
        value: mock

databases:
  - name: vakta-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
    databaseName: vakta_db
    user: vakta_db_user
